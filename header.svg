<svg xmlns="http://www.w3.org/2000/svg" width="700" height="150" viewBox="0 0 700 150">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#e6fffb"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="350" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="58" font-weight="700" fill="url(#g)" filter="url(#glow)">Hi, I'm Bhartesh</text>
  <text x="350" y="108" text-anchor="middle" font-family="Courier New, monospace"
        font-size="14" letter-spacing="7" fill="#cbd5e1">DATA ANALYST</text>
  <rect x="130" y="124" width="440" height="3" fill="#0e8fa8"/>
</svg>
