<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bb8f5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2bb8f5"/>
      <stop offset="1" stop-color="#2bb8f5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="180" fill="#050a10"/>
  <path d="M0 150 Q150 110 300 140 T600 130 T900 140 T1200 120" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="1200" stroke-dashoffset="1200">
    <animate attributeName="stroke-dashoffset" values="1200;0;0;1200" keyTimes="0;0.4;0.8;1" dur="7s" repeatCount="indefinite"/>
  </path>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="70" font-size="34" font-weight="700" fill="#ffffff" opacity="0">Thanks for visiting my profile
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="600" y="108" font-size="20" fill="#8fb8e6" letter-spacing="2" opacity="0">Let's turn data into decisions together.
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.8s" fill="freeze"/>
    </text>
  </g>
</svg>
