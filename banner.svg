<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Bhartesh Bhujaballi - Data Analyst" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#0d1b2e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fa8e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1fa8e8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal">
      <rect x="540" y="0" width="0" height="400">
        <animate attributeName="width" values="0;600;600;600" keyTimes="0;0.5;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#1c2b42" stroke-width="1">
    <line x1="540" y1="100" x2="1140" y2="100"/>
    <line x1="540" y1="180" x2="1140" y2="180"/>
    <line x1="540" y1="260" x2="1140" y2="260"/>
    <line x1="540" y1="340" x2="1140" y2="340"/>
  </g>

  <!-- floating background particles -->
  <g fill="#1fa8e8" opacity="0.5">
    <circle cx="300" cy="60" r="2"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="330" r="2"><animate attributeName="cy" values="330;310;330" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="50" r="2"><animate attributeName="cy" values="50;70;50" dur="7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- area fill, revealed left to right -->
  <g clip-path="url(#reveal)">
    <path d="M560 300 L640 270 L720 285 L800 225 L880 245 L960 175 L1040 135 L1120 105 L1120 340 L560 340 Z" fill="url(#area)"/>
  </g>

  <!-- animated line -->
  <path id="line" d="M560 300 L640 270 L720 285 L800 225 L880 245 L960 175 L1040 135 L1120 105"
        fill="none" stroke="#2bb8f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1" stroke-dasharray="1" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="1;0;0;0" keyTimes="0;0.5;0.92;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- data points pop in as the line reaches them -->
  <g fill="#0a0f1a" stroke="#2bb8f5" stroke-width="3">
    <circle cx="560" cy="300" r="7"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.01;0.04;0.92;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="270" r="7"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0675;0.1;0.92;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="285" r="7"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.132;0.16;0.92;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="225" r="7"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2115;0.24;0.92;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="245" r="7"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.277;0.31;0.92;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="175" r="7"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.361;0.39;0.92;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="135" r="7"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4315;0.46;0.92;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="105" r="7"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.92;1" dur="8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glowing tip that travels along the line -->
  <circle r="9" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.5;1"
      path="M560 300 L640 270 L720 285 L800 225 L880 245 L960 175 L1040 135 L1120 105"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.56;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- final pulse at the peak -->
  <circle cx="1120" cy="105" r="8" fill="none" stroke="#2bb8f5" stroke-width="2" opacity="0">
    <animate attributeName="r" values="8;8;30;30" keyTimes="0;0.5;0.7;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.5;0.52;0.7;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="60" y="150" font-size="52" font-weight="500" letter-spacing="6" opacity="0">
      BHARTESH
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-30 0" to="0 0" dur="1s" fill="freeze"/>
    </text>
    <text x="60" y="225" font-size="76" font-weight="800" opacity="0" filter="url(#glow)">
      BHUJABALLI
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-30 0" to="0 0" dur="1s" begin="0.4s" fill="freeze"/>
    </text>
    <text x="62" y="275" font-size="24" letter-spacing="12" fill="#b9c7d9" opacity="0">
      Data Analyst
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.9s" fill="freeze"/>
    </text>
  </g>
  <rect x="62" y="298" width="0" height="4" rx="2" fill="#2bb8f5">
    <animate attributeName="width" from="0" to="90" dur="0.8s" begin="1.2s" fill="freeze"/>
  </rect>
</svg>
